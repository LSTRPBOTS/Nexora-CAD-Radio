<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD Login</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .login-box {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 8px;
      width: 350px;
      margin: 0 auto;
      padding: 20px;
    }
    button {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      background-color: #0078d7;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 4px;
      border: none;
      background-color: #222;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Nexora CAD Login</h1>

  <div class="login-box">

    <button onclick="loginGoogle()">Login with Google</button>
    <button onclick="loginDiscord()">Login with Discord</button>

    <hr style="margin: 20px 0; border-color:#333;">

    <h3>Manual Login</h3>
    <input id="manualUser" placeholder="Username">
    <input id="manualPass" type="password" placeholder="Password">
    <button onclick="manualLogin()">Login</button>

  </div>

  <script src="login.js"></script>
</body>
</html>
