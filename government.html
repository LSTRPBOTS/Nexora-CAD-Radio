<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora CAD System - Government Division Maker</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    input, select, button {
      margin: 10px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      background-color: #0078d7;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <h2>Government Division Maker</h2>
  <input type="text" id="communityCode" placeholder="Community Code">
  <input type="text" id="divisionName" placeholder="Division Name">
  <select id="divisionType">
    <option value="Police">Police</option>
    <option value="Fire">Fire</option>
    <option value="EMS">EMS</option>
    <option value="Civilian">Civilian</option>
  </select>
  <button id="createDivisionBtn">Submit Division</button>

  <script src="government.js"></script>
</body>
</html>
