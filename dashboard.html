<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD Dashboard</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
    }
    h1 { margin-bottom: 10px; }
    .info-box {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 15px;
      width: 80%;
      margin: 0 auto 20px auto;
      text-align: left;
    }
    .module-btn {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 12px;
      background-color: #0078d7;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .module-btn:hover { background-color: #005fa3; }
    .logout-btn {
      margin-top: 30px;
      background-color: #a30000;
    }
    .logout-btn:hover { background-color: #7a0000; }
  </style>
</head>
<body>

  <h1>Nexora CAD Dashboard</h1>
  <p>Welcome to your CAD system.</p>

  <div class="info-box" id="sessionInfo">
    Loading session...
  </div>

  <h2>Available Modules</h2>

  <div id="moduleButtons"></div>

  <button class="module-btn logout-btn" onclick="logout()">Log Out</button>

  <script src="dashboard.js"></script>
</body>
</html>
