<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora CAD System Login</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      width: 250px;
    }
    input {
      margin-bottom: 10px;
      padding: 8px;
      border: none;
      border-radius: 4px;
    }
    button {
      padding: 10px;
      background-color: #1e90ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0078d7;
    }
  </style>
</head>
<body>
  <h1>Nexora CAD System Login</h1>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="text" id="badge" placeholder="Badge / Unit ID" required>
    <input type="text" id="unit" placeholder="Officer Unit" required>
    <button type="submit">Login</button>
  </form>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        badge: document.getElementById("badge").value,
        unit: document.getElementById("unit").value
      };

      try {
        const res = await fetch("https://nexora-kv-manager-creator.nexora-systems.workers.dev/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          alert("Welcome back, " + data.username + "!");
          window.location.href = "mdt.html"; // redirect to your CAD dashboard
        } else {
          alert("Invalid username or password.");
        }
      } catch (err) {
        alert("Error connecting to server. Please try again later.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
