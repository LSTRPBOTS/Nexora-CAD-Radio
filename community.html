<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD System - Community Selector</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }
    h1 { margin-bottom: 20px; }
    h2 { margin-top: 40px; }
    input {
      width: 300px;
      padding: 8px;
      margin: 5px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 8px 16px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005fa3; }
    .community-item {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin: 10px auto;
      width: 320px;
    }
  </style>
</head>
<body>
  <h1>Select or Create Your Community</h1>
  <button id="adminPanelBtn" style="display:none;">Admin Panel</button>

  <!-- Create New Community (normal users) -->
  <h2>Create New Community</h2>
  <input id="newCommunityName" placeholder="Community Name"><br>
  <input id="newCommunityCode" placeholder="Community ID (short code)"><br>
  <input id="newOwnerEmail" placeholder="Your Email (for staff contact)"><br>
  <button id="createCommunityBtn">Register New Community</button>

  <!-- Staff Approval -->
  <h2>Staff Approval</h2>
  <input id="approveCode" placeholder="Community Code to Approve"><br>
  <input id="approverName" placeholder="Your Name or Email"><br>
  <button id="approveBtn">Approve Community</button>

  <!-- Admin Panel (master only) -->
  <div id="adminPanel" style="display:none; margin-top:40px;">
    <h2>Admin Panel (Master Only)</h2>
    <input id="adminCommunityName" placeholder="Community Name"><br>
    <input id="adminCommunityCode" placeholder="Community ID (short code)"><br>
    <input id="adminOwnerEmail" placeholder="Owner Email"><br>
    <input id="adminMasterKey" placeholder="Master Key"><br>
    <button id="adminCreateBtn">Create Community (Bypass Approval)</button>
  </div>

  <!-- Existing Communities -->
  <h2>Existing Communities</h2>
  <div id="communityList"><p>Loading communities...</p></div>

  <script src="community.js"></script>
</body>
</html>
