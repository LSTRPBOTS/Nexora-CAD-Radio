<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora CAD System - Community Selector</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    .community-btn {
      background-color: #0078d7;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
    .community-btn:hover {
      background-color: #005fa3;
    }
    #topBar {
      position: absolute;
      top: 10px;
      right: 20px;
    }
    #registerBtn {
      background-color: #0078d7;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #registerBtn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <div id="topBar">
    <button id="registerBtn">Register Community</button>
  </div>

  <h2>Select Your Community</h2>
  <div id="communityList"></div>

  <script src="community.js"></script>
</body>
</html>
