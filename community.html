<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD System - Community Selector</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    h1 { margin-bottom: 40px; }
    #communityList { margin-top: 20px; }
    .community-item {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin: 10px auto;
      width: 320px;
    }
    button {
      padding: 8px 16px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005fa3; }
  </style>
</head>
<body>
  <h1>Select Your Community</h1>
  <div id="communityList"><p>Loading communities...</p></div>

  <script src="community.js"></script>
</body>
</html>
