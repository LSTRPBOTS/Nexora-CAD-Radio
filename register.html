<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Community</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    input {
      width: 300px;
      padding: 8px;
      margin: 5px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <h2>Register Your Community</h2>
  <p>Fill out the form below. Staff will review and approve your community.</p>

  <input id="communityName" placeholder="Community Name"><br>
  <input id="communityCode" placeholder="Community ID (short code)"><br>
  <input id="ownerEmail" placeholder="Your Email (for staff contact)"><br>
  <button id="registerBtn">Register Community</button>

  <script src="register.js"></script>
</body>
</html>
