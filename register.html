<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD System - Community Selector</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    h1 { margin-bottom: 40px; }
    input {
      width: 300px;
      padding: 8px;
      margin: 5px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005fa3; }
  </style>
</head>
<body>
  <h1>Select Your Community</h1>

  <input id="communityName" placeholder="Community Name"><br>
  <input id="communityCode" placeholder="Community ID (short code)"><br>
  <input id="ownerEmail" placeholder="Your Email (for staff contact)"><br>
  <button id="registerBtn">Register Community</button>

  <script>
    // --- FIXED INLINE SCRIPT ---
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const name = document.getElementById("communityName").value.trim();
      const code = document.getElementById("communityCode").value.trim();
      const ownerEmail = document.getElementById("ownerEmail").value.trim();

      if (!name || !code || !ownerEmail) {
        alert("Please fill out all fields.");
        return;
      }

      console.log("Register button clicked. Sending data...");

      try {
        // Direct call to Worker domain to avoid HTML response
        const res = await fetch("https://nexora-systems-worker.nexora-systems.workers.dev/register-community", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, code, ownerEmail }),
        });

        // Check if response is JSON before parsing
        const text = await res.text();
        if (text.startsWith("<")) {
          console.error("Received HTML instead of JSON:", text.slice(0, 100));
          alert("Server returned HTML instead of JSON. Check Worker URL.");
          return;
        }

        const data = JSON.parse(text);
        console.log("Response:", data);
        alert(data.message || "Registration complete.");
      } catch (err) {
        console.error("Error:", err);
        alert("Error connecting to server. Check Worker deployment.");
      }
    });
  </script>
</body>
</html>
