<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora CAD System - Community Selector</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    h1 { margin-bottom: 40px; }
    input {
      width: 300px;
      padding: 8px;
      margin: 5px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005fa3; }
  </style>
</head>
<body>
  <h1>Select Your Community</h1>

  <input id="communityName" placeholder="Community Name"><br>
  <input id="communityCode" placeholder="Community ID (short code)"><br>
  <input id="ownerEmail" placeholder="Your Email (for staff contact)"><br>
  <button id="registerBtn">Register Community</button>

  <!-- Link your JS file here -->
  <script src="register.js"></script>
</body>
</html>
