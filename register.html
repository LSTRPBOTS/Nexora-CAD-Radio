<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Community</title>
</head>
<body>
  <h2>Register Your Community</h2>
  <p>Fill out the form below to create your community ID. Staff will review and approve it.</p>

  <input id="communityName" placeholder="Community Name"><br><br>
  <input id="communityCode" placeholder="Community ID (short code)"><br><br>
  <input id="ownerEmail" placeholder="Your Email (for staff contact)"><br><br>
  <button id="registerBtn">Register Community</button>

  <script src="register.js"></script>
</body>
</html>
